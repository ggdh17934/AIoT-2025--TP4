name: Build firmware
on:
  push:
    paths:
      - 'src/**'
      - 'platformio.ini'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Compile firmware
        run: |
          pio run -e esp32dev
          pio run -e esp32-http
